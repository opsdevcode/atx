[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atx"
version = "0.5.0"
description = "Short-hand wrapper for atmos terraform/workflow with stack aliases and fzf picker"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
authors = [{ name = "Eric Skaggs" }]
dependencies = [
  "click>=8.1",
]

[project.scripts]
atx = "atx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
